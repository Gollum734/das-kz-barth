<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio-Guide</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <a href="index.html" class="back-link">&larr; Zurück zur Übersicht</a>
        <h1 id="station-title">Lädt...</h1>
    </header>

    <main class="container">
        <div class="audio-section" id="audio-container">
            <p>Audio wird geladen...</p>
        </div>

        <div class="audio-section">
            <p id="station-desc" style="text-align: left; font-size: 1.1rem; line-height: 1.7; white-space: pre-line;"></p>
        </div>

        <section id="gallery-section" style="display:none;">
            <h2>Bilder zu dieser Station</h2>
            <div class="gallery" id="station-gallery"></div>
        </section>
    </main>

    <script>
        const params = new URLSearchParams(window.location.search);
        const stationId = params.get('id');

        if (stationId) {
            fetch(`stations/${stationId}/info.txt`)
                .then(res => {
                    if (!res.ok) throw new Error("Station nicht gefunden");
                    return res.text();
                })
                .then(text => {
                    const lines = text.split('\n').map(l => l.trim());
                    
                    const title = lines[0] || '';
                    const rawDesc = lines[1] || '';
                    
                    // Jedes Semikolon wird hier in einen echten Zeilenumbruch umgewandelt
                    const description = rawDesc.split(';').join('\n');
                    
                    const audioLine = lines[2] || '';
                    const imageLine = lines[3] || '';
                    
                    // 1. Titel & Beschreibung setzen
                    document.getElementById('station-title').innerText = title;
                    document.getElementById('station-desc').innerText = description;

                    // 2. Audio-Dateien dynamisch laden
                    const audioContainer = document.getElementById('audio-container');
                    audioContainer.innerHTML = ''; 

                    if (audioLine && audioLine.trim() !== '') {
                        const audios = audioLine.split(',');

                        audios.forEach(audioName => {
                            const trimmedAudio = audioName.trim();
                            if (trimmedAudio) {
                                const trackTitle = document.createElement('p');
                                trackTitle.style.fontWeight = 'bold';
                                trackTitle.style.marginBottom = '5px';
                                trackTitle.innerText = trimmedAudio.replace('.mp3', '').toUpperCase();

                                const player = document.createElement('audio');
                                player.controls = true;
                                player.preload = "metadata";
                                player.playsinline = true;
                                player.src = `stations/${stationId}/${trimmedAudio}`;
                                player.style.width = "100%";
                                player.style.maxWidth = "500px";
                                player.style.marginBottom = "20px";

                                audioContainer.appendChild(trackTitle);
                                audioContainer.appendChild(player);
                            }
                        });
                    } else {
                        audioContainer.innerHTML = '<p>Keine Audio-Guides für diese Station verfügbar.</p>';
                    }

                    // 3. Bilder laden
                    if (imageLine && imageLine.trim() !== '') {
                        const gallery = document.getElementById('station-gallery');
                        const images = imageLine.split(',');

                        images.forEach(imgName => {
                            const trimmedName = imgName.trim();
                            if (trimmedName) {
                                const img = document.createElement('img');
                                img.src = `stations/${stationId}/images/${trimmedName}`;
                                img.alt = "Stationsbild";
                                gallery.appendChild(img);
                            }
                        });
                        document.getElementById('gallery-section').style.display = 'block';
                    }
                })
                .catch(err => {
                    document.getElementById('station-title').innerText = "Fehler";
                    document.getElementById('audio-container').innerHTML = '';
                    document.getElementById('station-desc').innerText = "Diese Station konnte nicht geladen werden.";
                });
        }
    </script>
</body>
</html>
