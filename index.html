<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gedenkseite KZ-Außenlager Barth</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <h1>Audioguides für das Konzentrationslager Bath</h1>
        <p>Ein digitaler Begleiter durch die Gedenkstätte</p>
    </header>

    <main class="container">
        <section>
            <h2>Audio-Guides & Stationen</h2>
            <div class="grid" id="stations-grid">
                </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Gedenkstätte Barth</p>
    </footer>

    <script>
        async function loadStations() {
            const grid = document.getElementById('stations-grid');
            let i = 1;
            let active = true;

            while (active) {
                try {
                    // Prüfen, ob der nächste Stationsordner existiert
                    const response = await fetch(`stations/station${i}/info.txt`);
                    
                    if (!response.ok) {
                        active = false; // Stoppen, wenn Ordner nicht existiert
                        break;
                    }

                    const text = await response.text();
                    const lines = text.split('\n');
                    const title = lines[0] || `Station ${i}`;
                    const desc = lines[1] || '';

                    // Kachel für die Startseite erstellen
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <h3>${title}</h3>
                        <p>${desc.substring(0, 120)}...</p>
                        <a href="guide.html?id=station${i}" class="btn">Guide öffnen</a>
                    `;
                    grid.appendChild(card);
                    
                    i++; // Nächste Station prüfen
                } catch (error) {
                    active = false;
                }
            }

            if (i === 1) {
                grid.innerHTML = "<p>Noch keine Stationen angelegt. Erstelle den Ordner 'stations/station1/'.</p>";
            }
        }

        // Starten beim Laden der Seite
        loadStations();
    </script>
</body>
</html>
